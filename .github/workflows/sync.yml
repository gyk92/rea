name: Sync Fork Daily
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 每天0点执行（北京时间早上8点）
  workflow_dispatch: # 支持手动点按钮立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          upstream_sync_repo: ORIGINAL_OWNER/ORIGINAL_REPO
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
